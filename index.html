<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom QR Code Generator — OmniTools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lightweight client-side QR library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
  <header class="border-b bg-white border-slate-200">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="../../index.html" class="flex items-center gap-2 text-sm font-bold text-slate-700 hover:text-indigo-600 transition-colors">
        <span>←</span>
        <span>Back to All Tools</span>
      </a>
      <span class="text-xs px-2.5 py-1 bg-emerald-50 text-emerald-700 font-semibold rounded-full border border-emerald-200">
        🔒 Runs 100% locally in browser
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="mb-6 flex items-center gap-3">
      <span class="text-3xl">📱</span>
      <div>
        <h1 class="text-2xl font-black text-slate-900">Custom QR Code Generator</h1>
        <p class="text-sm text-slate-500">Create crisp QR codes for links, text, and Wi-Fi. Download in PNG.</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Enter URL or Plain Text</label>
          <textarea id="qrText" rows="4" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-indigo-600">https://github.com</textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">QR Color</label>
            <input type="color" id="qrColor" value="#000000" class="w-full h-10 p-1 border border-slate-300 rounded-xl cursor-pointer" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Background Color</label>
            <input type="color" id="qrBg" value="#ffffff" class="w-full h-10 p-1 border border-slate-300 rounded-xl cursor-pointer" />
          </div>
        </div>
      </div>

      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center justify-center">
        <div id="qrcode" class="p-4 bg-white border border-slate-100 rounded-2xl shadow-sm"></div>
        <button id="downloadQrBtn" class="mt-6 px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition-all shadow-md shadow-indigo-500/20">
          ⬇️ Download QR Code (PNG)
        </button>
      </div>
    </div>
  </main>

  <script>
    const qrText = document.getElementById('qrText');
    const qrColor = document.getElementById('qrColor');
    const qrBg = document.getElementById('qrBg');
    const qrcodeDiv = document.getElementById('qrcode');
    const downloadQrBtn = document.getElementById('downloadQrBtn');

    let qr = null;

    function generateQR() {
      qrcodeDiv.innerHTML = '';
      const text = qrText.value.trim() || 'https://github.com';
      qr = new QRCode(qrcodeDiv, {
        text: text,
        width: 200,
        height: 200,
        colorDark: qrColor.value,
        colorLight: qrBg.value,
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    [qrText, qrColor, qrBg].forEach(inp => inp.addEventListener('input', generateQR));
    generateQR();

    downloadQrBtn.addEventListener('click', () => {
      const img = qrcodeDiv.querySelector('img');
      if (img && img.src) {
        const a = document.createElement('a');
        a.href = img.src;
        a.download = 'qrcode.png';
        a.click();
      }
    });
  </script>
</body>
</html>
