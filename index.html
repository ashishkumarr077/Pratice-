<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Discount Calculator — OmniTools</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
  <header class="border-b bg-white border-slate-200">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="../../index.html" class="flex items-center gap-2 text-sm font-bold text-slate-700 hover:text-indigo-600 transition-colors">
        <span>←</span>
        <span>Back to All Tools</span>
      </a>
      <span class="text-xs px-2.5 py-1 bg-emerald-50 text-emerald-700 font-semibold rounded-full border border-emerald-200">
        🔒 Runs 100% locally in browser
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="mb-6 flex items-center gap-3">
      <span class="text-3xl">🏷️</span>
      <div>
        <h1 class="text-2xl font-black text-slate-900">Shopping Discount Calculator</h1>
        <p class="text-sm text-slate-500">Calculate final price after store discounts and extra coupon codes.</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Original Price ($)</label>
          <input type="number" id="origPrice" value="120" min="0" step="any" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-lg font-bold focus:outline-none focus:border-indigo-600" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Primary Discount (%)</label>
          <input type="number" id="discPercent" value="30" min="0" max="100" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-lg font-bold focus:outline-none focus:border-indigo-600" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Additional Coupon / Promo (%) [Optional]</label>
          <input type="number" id="extraCoupon" value="5" min="0" max="100" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-lg font-bold focus:outline-none focus:border-indigo-600" />
        </div>
      </div>

      <div class="bg-gradient-to-br from-emerald-900 to-slate-900 text-white p-6 rounded-2xl shadow-lg flex flex-col justify-between">
        <div>
          <span class="text-xs font-semibold tracking-wider uppercase text-emerald-300">Final Price You Pay</span>
          <div id="finalPrice" class="text-4xl font-black text-white mt-1">$79.80</div>
        </div>

        <div class="grid grid-cols-2 gap-4 pt-6 border-t border-emerald-800/80 mt-6">
          <div class="bg-emerald-950/60 p-3 rounded-xl border border-emerald-800/50">
            <span class="text-[11px] text-emerald-300 font-medium">You Save</span>
            <div id="totalSaved" class="text-xl font-bold text-emerald-400 mt-0.5">$40.20</div>
          </div>
          <div class="bg-emerald-950/60 p-3 rounded-xl border border-emerald-800/50">
            <span class="text-[11px] text-emerald-300 font-medium">Effective Discount</span>
            <div id="effectiveRate" class="text-xl font-bold text-white mt-0.5">33.5% OFF</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const origPrice = document.getElementById('origPrice');
    const discPercent = document.getElementById('discPercent');
    const extraCoupon = document.getElementById('extraCoupon');

    const finalPrice = document.getElementById('finalPrice');
    const totalSaved = document.getElementById('totalSaved');
    const effectiveRate = document.getElementById('effectiveRate');

    function calcDiscount() {
      const price = parseFloat(origPrice.value) || 0;
      const d1 = parseFloat(discPercent.value) || 0;
      const d2 = parseFloat(extraCoupon.value) || 0;

      const priceAfterFirst = price - (price * (d1 / 100));
      const final = priceAfterFirst - (priceAfterFirst * (d2 / 100));
      const saved = price - final;
      const eff = price > 0 ? (saved / price) * 100 : 0;

      finalPrice.textContent = '$' + final.toFixed(2);
      totalSaved.textContent = '$' + saved.toFixed(2);
      effectiveRate.textContent = eff.toFixed(1) + '% OFF';
    }

    [origPrice, discPercent, extraCoupon].forEach(inp => inp.addEventListener('input', calcDiscount));
    calcDiscount();
  </script>
</body>
</html>
