<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exact Age & Birthday Countdown — OmniTools</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
  <header class="border-b bg-white border-slate-200">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="../../index.html" class="flex items-center gap-2 text-sm font-bold text-slate-700 hover:text-indigo-600 transition-colors">
        <span>←</span>
        <span>Back to All Tools</span>
      </a>
      <span class="text-xs px-2.5 py-1 bg-emerald-50 text-emerald-700 font-semibold rounded-full border border-emerald-200">
        🔒 Runs 100% locally in browser
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🎂</span>
        <div>
          <h1 class="text-2xl font-black text-slate-900">Exact Age & Birthday Countdown</h1>
          <p class="text-sm text-slate-500">Calculate chronological age in years, months, and days, plus next birthday countdown.</p>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Date of Birth</label>
          <input type="date" id="dobInput" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:border-indigo-600" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Age as of Date</label>
          <input type="date" id="targetDateInput" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:border-indigo-600" />
        </div>
      </div>

      <div class="md:col-span-2 bg-gradient-to-br from-indigo-900 to-slate-900 text-white p-6 rounded-2xl shadow-lg flex flex-col justify-between">
        <div>
          <span class="text-xs font-semibold tracking-wider uppercase text-indigo-300">Your Current Age</span>
          <div id="mainAgeText" class="text-3xl font-black text-white mt-1">Select your birth date</div>
        </div>

        <div class="grid grid-cols-3 gap-3 pt-6 border-t border-indigo-800/80 mt-6 text-center">
          <div class="bg-indigo-950/50 p-3 rounded-xl border border-indigo-800/50">
            <span class="text-[10px] text-indigo-300 uppercase font-semibold">Total Days</span>
            <div id="totalDays" class="text-lg font-bold text-white mt-0.5">-</div>
          </div>
          <div class="bg-indigo-950/50 p-3 rounded-xl border border-indigo-800/50">
            <span class="text-[10px] text-indigo-300 uppercase font-semibold">Total Hours</span>
            <div id="totalHours" class="text-lg font-bold text-white mt-0.5">-</div>
          </div>
          <div class="bg-indigo-950/50 p-3 rounded-xl border border-indigo-800/50">
            <span class="text-[10px] text-amber-300 uppercase font-semibold">Next Birthday In</span>
            <div id="nextBirthday" class="text-lg font-bold text-amber-300 mt-0.5">-</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const dobInput = document.getElementById('dobInput');
    const targetDateInput = document.getElementById('targetDateInput');
    const mainAgeText = document.getElementById('mainAgeText');
    const totalDays = document.getElementById('totalDays');
    const totalHours = document.getElementById('totalHours');
    const nextBirthday = document.getElementById('nextBirthday');

    // Default to today and a sample DOB
    const today = new Date();
    targetDateInput.value = today.toISOString().split('T')[0];
    dobInput.value = '2000-01-01';

    function calculateAge() {
      if (!dobInput.value || !targetDateInput.value) return;

      const birth = new Date(dobInput.value);
      const target = new Date(targetDateInput.value);

      if (birth > target) {
        mainAgeText.textContent = "Birth date must be in past!";
        return;
      }

      let years = target.getFullYear() - birth.getFullYear();
      let months = target.getMonth() - birth.getMonth();
      let days = target.getDate() - birth.getDate();

      if (days < 0) {
        months--;
        const prevMonth = new Date(target.getFullYear(), target.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years--;
        months += 12;
      }

      mainAgeText.textContent = `${years} Years, ${months} Months, ${days} Days`;

      const diffTime = target - birth;
      const daysCount = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      totalDays.textContent = daysCount.toLocaleString();
      totalHours.textContent = (daysCount * 24).toLocaleString();

      // Next birthday countdown
      let nextBday = new Date(target.getFullYear(), birth.getMonth(), birth.getDate());
      if (nextBday < target) {
        nextBday.setFullYear(target.getFullYear() + 1);
      }
      const bdayDiff = Math.ceil((nextBday - target) / (1000 * 60 * 60 * 24));
      nextBirthday.textContent = `${bdayDiff} Days`;
    }

    dobInput.addEventListener('change', calculateAge);
    targetDateInput.addEventListener('change', calculateAge);
    calculateAge();
  </script>
</body>
</html>
