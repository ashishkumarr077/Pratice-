<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strong Password Generator — OmniTools</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
  <header class="border-b bg-white border-slate-200">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="../../index.html" class="flex items-center gap-2 text-sm font-bold text-slate-700 hover:text-indigo-600 transition-colors">
        <span>←</span>
        <span>Back to All Tools</span>
      </a>
      <span class="text-xs px-2.5 py-1 bg-emerald-50 text-emerald-700 font-semibold rounded-full border border-emerald-200">
        🔒 Runs 100% locally in browser
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="mb-6 flex items-center gap-3">
      <span class="text-3xl">🔐</span>
      <div>
        <h1 class="text-2xl font-black text-slate-900">Strong Password Generator</h1>
        <p class="text-sm text-slate-500">Generate uncrackable passwords using your browser's cryptographic randomness.</p>
      </div>
    </div>

    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
      <!-- PASSWORD DISPLAY -->
      <div class="relative flex items-center">
        <input type="text" id="passDisplay" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-3.5 font-mono text-base font-bold text-slate-800 tracking-wider focus:outline-none" />
        <button id="copyPassBtn" class="absolute right-2 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition-all shadow-sm">
          Copy
        </button>
      </div>

      <!-- CONTROLS -->
      <div class="space-y-4">
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-slate-700">Password Length</span>
            <span id="lengthDisplay" class="text-xs font-black text-indigo-600">16 characters</span>
          </div>
          <input type="range" id="passLength" min="8" max="40" value="16" class="w-full accent-indigo-600 cursor-pointer" />
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
            <input type="checkbox" id="includeUpper" checked class="accent-indigo-600 w-4 h-4 rounded" />
            <span>Uppercase (A-Z)</span>
          </label>
          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
            <input type="checkbox" id="includeLower" checked class="accent-indigo-600 w-4 h-4 rounded" />
            <span>Lowercase (a-z)</span>
          </label>
          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
            <input type="checkbox" id="includeNumbers" checked class="accent-indigo-600 w-4 h-4 rounded" />
            <span>Numbers (0-9)</span>
          </label>
          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
            <input type="checkbox" id="includeSymbols" checked class="accent-indigo-600 w-4 h-4 rounded" />
            <span>Symbols (!@#$%)</span>
          </label>
        </div>

        <button id="regenBtn" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition-all">
          🔄 Generate New Password
        </button>
      </div>
    </div>
  </main>

  <script>
    const passDisplay = document.getElementById('passDisplay');
    const passLength = document.getElementById('passLength');
    const lengthDisplay = document.getElementById('lengthDisplay');
    const includeUpper = document.getElementById('includeUpper');
    const includeLower = document.getElementById('includeLower');
    const includeNumbers = document.getElementById('includeNumbers');
    const includeSymbols = document.getElementById('includeSymbols');
    const copyPassBtn = document.getElementById('copyPassBtn');
    const regenBtn = document.getElementById('regenBtn');

    function generatePassword() {
      const len = parseInt(passLength.value, 10);
      lengthDisplay.textContent = len + ' characters';

      let chars = '';
      if (includeUpper.checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (includeLower.checked) chars += 'abcdefghijklmnopqrstuvwxyz';
      if (includeNumbers.checked) chars += '0123456789';
      if (includeSymbols.checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

      if (!chars) {
        passDisplay.value = 'Select at least 1 option!';
        return;
      }

      // Cryptographically secure generation
      const array = new Uint32Array(len);
      window.crypto.getRandomValues(array);
      let pwd = '';
      for (let i = 0; i < len; i++) {
        pwd += chars[array[i] % chars.length];
      }
      passDisplay.value = pwd;
    }

    [passLength, includeUpper, includeLower, includeNumbers, includeSymbols].forEach(inp => inp.addEventListener('input', generatePassword));
    regenBtn.addEventListener('click', generatePassword);

    copyPassBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(passDisplay.value);
      copyPassBtn.textContent = 'Copied!';
      setTimeout(() => copyPassBtn.textContent = 'Copy', 1500);
    });

    generatePassword();
  </script>
</body>
</html>
